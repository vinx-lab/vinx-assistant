# CI：ubuntu 上做格式、vet、测试；三个平台各编译并测试一次。
# macOS、Windows 默认标为实验性（不阻塞合并），在真实平台验证过后可以去掉 continue-on-error。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: vet / test / gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件需要 gofmt："
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  build:
    name: build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: true
          - os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -count=1 ./...
