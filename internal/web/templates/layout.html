{{define "layout"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Vinx 助手</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Vinx 助手</a>
  <nav>
    <a href="/" {{if eq .Nav "board"}}aria-current="page"{{end}}>看板</a>
    <a href="/search" {{if eq .Nav "search"}}aria-current="page"{{end}}>搜索</a>
    <a href="/usage" {{if eq .Nav "usage"}}aria-current="page"{{end}}>用量</a>
    <a href="/settings" {{if eq .Nav "settings"}}aria-current="page"{{end}}>设置</a>
    <a href="/login" {{if eq .Nav "login"}}aria-current="page"{{end}}>微信</a>
  </nav>
</header>
<main>
{{if .Msg}}<p class="flash">{{.Msg}}</p>{{end}}
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
