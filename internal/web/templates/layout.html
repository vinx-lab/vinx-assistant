{{define "layout"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · Vinx 助手</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">V</span>Vinx 助手</a>
    <nav class="nav" aria-label="主导航">
      <a href="/" {{if eq .Nav "board"}}aria-current="page"{{end}}>看板</a>
      <a href="/search" {{if eq .Nav "search"}}aria-current="page"{{end}}>搜索</a>
      <a href="/usage" {{if eq .Nav "usage"}}aria-current="page"{{end}}>用量</a>
      <a href="/settings" {{if eq .Nav "settings"}}aria-current="page"{{end}}>设置</a>
      <a href="/login" {{if eq .Nav "login"}}aria-current="page"{{end}}>微信</a>
    </nav>
  </div>
</header>
<main id="main">
<h1 class="sr-only">{{.Title}}</h1>
{{if .Msg}}<p class="flash" role="status">{{.Msg}}</p>{{end}}
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
