{{define "layout"}}<!doctype html>
<html lang="zh-CN" data-base="{{base}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{.Title}} · Vinx 助手</title>
<link rel="stylesheet" href="{{base}}/static/app.css">
</head>
<body class="signin-body">
<main class="signin" id="main">
  <p class="brand"><span class="logo" aria-hidden="true">V</span>Vinx 助手</p>
  <form method="post" action="{{base}}/signin" class="card">
    <h1>输入密码</h1>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Next}}">
    <label>密码<input name="password" type="password" autocomplete="current-password" required autofocus></label>
    <button type="submit" class="btn primary">登录</button>
  </form>
</main>
</body>
</html>{{end}}
