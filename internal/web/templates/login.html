{{define "content"}}
<div class="page-head"><h1>微信登录</h1></div>
<section class="card login" data-login-state="{{.Status.State}}">
  <h2>微信连接</h2>
  <p>{{if eq .WeChat "ok"}}<span class="chip ok">当前微信连接：正常</span>{{else if eq .WeChat "paused"}}<span class="chip warn">当前微信连接：暂停中（凭证失效 -14，会自动重试）</span>{{else}}<span class="chip warn">当前微信连接：未登录</span>{{end}}</p>
  <p id="login-msg" role="status">{{.Status.Message}}</p>
  <div class="qr-frame" id="login-qr-box" {{if not .Status.HasQR}}hidden{{end}}><img id="login-qr" src="{{base}}/login/qr.png" alt="微信登录二维码" width="280" height="280"></div>
  <form method="post" action="{{base}}/login/verify" id="login-verify" class="stack" {{if ne .Status.State "need_verify"}}hidden{{end}}>
    <label>手机上显示的数字<input name="code" inputmode="numeric" autocomplete="one-time-code"></label>
    <button type="submit" class="btn primary">提交</button>
  </form>
  <form method="post" action="{{base}}/login/start" class="inline">
    <button type="submit" class="btn{{if ne .WeChat "ok"}} primary{{end}}">{{if eq .WeChat "ok"}}重新扫码{{else}}获取二维码{{end}}</button>
  </form>
</section>
{{end}}
