{{define "content"}}
<form method="get" action="/search" class="panel stack" role="search">
  <label class="field">关键词<input type="search" name="q" value="{{.Q}}" autofocus enterkeyhint="search"></label>
  <div class="grid2 tight">
    <label>分类
      <select name="cat"><option value="">全部</option>{{range .Categories}}<option value="{{.}}" {{if eq (print .) $.Cat}}selected{{end}}>{{catName .}}</option>{{end}}</select>
    </label>
    <label>状态
      <select name="status"><option value="">全部</option>{{range .Statuses}}<option value="{{.}}" {{if eq . $.Status}}selected{{end}}>{{statusName .}}</option>{{end}}</select>
    </label>
    <label>从<input type="date" name="from" value="{{.From}}"></label>
    <label>到<input type="date" name="to" value="{{.To}}"></label>
  </div>
  <div class="form-foot"><button type="submit" class="primary">搜索</button></div>
</form>
{{if .Searched}}
<p class="hint" role="status">找到 {{len .Items}} 条</p>
<div class="list">
{{range .Items}}
<article class="card {{if .Priority}}prio-{{.Priority}}{{end}}">
  <div class="card-main">
    <h3><a href="/items/{{.ID}}">#{{.ID}} {{display .}}</a></h3>
    {{if .Summary}}<p class="summary-text">{{.Summary}}</p>{{end}}
    <p class="meta">
      <span class="badge st">{{catName .Category}}</span>
      <span class="badge st">{{statusName .Status}}</span>
      <span class="badge">{{fmtTime .CreatedAt}}</span>
      {{range .Labels}}<span class="tag tag-label">{{.}}</span>{{end}}{{range .Topics}}<span class="tag tag-topic">#{{.}}</span>{{end}}
    </p>
  </div>
</article>
{{end}}
</div>
{{end}}
{{end}}
